name: Semantic Release
run-name: Release - ${{ github.sha }}
on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions: {}

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    permissions:
      contents: write # to be able to publish a GitHub release
      issues: write # to be able to comment on released issues
      pull-requests: write # to be able to comment on released pull requests
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Run tests
        run: npm test -- --runInBand

      - name: Build action
        run: npm run build

      - name: Package action
        run: npm run package

      - name: Semantic Release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Update major version tag
        run: |
          latest_tag=$(git tag --points-at HEAD | sort -V | tail -n 1)
          if [ -z "$latest_tag" ]; then
            echo "No release tag was created for this commit."
            exit 0
          fi

          major_tag=$(echo "$latest_tag" | sed -E 's/^(v[0-9]+).*/\1/')
          git tag -f "$major_tag" "$latest_tag"
          git push origin "refs/tags/$major_tag" --force
